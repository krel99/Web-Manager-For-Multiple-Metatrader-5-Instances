<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Zone Trader</title>
        <style>
            :root {
                --bg: #f4f5f7;
                --surface: #ffffff;
                --border: #dde1e9;
                --border2: #c4cad6;
                --text: #1e2330;
                --muted: #8b93a4;
                --buy: #007a4d;
                --buy-dim: #007a4d14;
                --sell: #c0252e;
                --sell-dim: #c0252e12;
                --strong: #b07800;
                --watched: #1455b3;
                --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                font-size: 14px;
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 24px 16px 64px;
            }
            h1 {
                font-size: 18px;
                font-weight: 600;
                margin: 0 0 16px;
                letter-spacing: 0.3px;
            }
            h2 {
                font-size: 14px;
                font-weight: 600;
                margin: 24px 0 8px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.6px;
            }

            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 16px;
            }

            form.grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }
            .field {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .field.full {
                grid-column: 1 / -1;
            }
            label {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: var(--muted);
            }
            input,
            select,
            button {
                font: inherit;
                color: var(--text);
                background: var(--surface);
                border: 1px solid var(--border2);
                border-radius: 6px;
                padding: 8px 10px;
                outline: none;
            }
            input:focus,
            select:focus {
                border-color: var(--text);
            }
            input[type="number"] {
                font-family: var(--mono);
            }

            .row-actions {
                grid-column: 1 / -1;
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                margin-top: 4px;
            }
            button.primary {
                background: var(--text);
                color: #fff;
                border-color: var(--text);
                cursor: pointer;
                padding: 9px 18px;
            }
            button.primary:hover {
                opacity: 0.9;
            }
            button.ghost {
                background: transparent;
                cursor: pointer;
            }

            #message {
                margin-top: 8px;
                font-size: 12px;
                min-height: 16px;
            }
            #message.ok {
                color: var(--buy);
            }
            #message.err {
                color: var(--sell);
            }

            table {
                width: 100%;
                border-collapse: collapse;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
                font-family: var(--mono);
                font-size: 12.5px;
            }
            th,
            td {
                padding: 8px 10px;
                text-align: left;
                border-bottom: 1px solid var(--border);
                white-space: nowrap;
            }
            th {
                background: var(--bg);
                font-weight: 600;
                color: var(--muted);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            tr:last-child td {
                border-bottom: 0;
            }
            .dir-long {
                color: var(--buy);
                font-weight: 600;
            }
            .dir-short {
                color: var(--sell);
                font-weight: 600;
            }
            .row-long {
                background: var(--buy-dim);
            }
            .row-short {
                background: var(--sell-dim);
            }

            .tag {
                display: inline-block;
                padding: 2px 8px;
                border-radius: 999px;
                font-size: 11px;
                font-family: -apple-system, sans-serif;
                font-weight: 600;
                letter-spacing: 0.3px;
            }
            .tag.win {
                background: var(--buy-dim);
                color: var(--buy);
            }
            .tag.loss {
                background: var(--sell-dim);
                color: var(--sell);
            }
            .tag.waiting {
                background: #1455b314;
                color: var(--watched);
            }
            .tag.expired {
                background: #00000010;
                color: var(--muted);
            }

            .checkbox-row {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 11px;
                color: var(--muted);
                text-transform: none;
                letter-spacing: 0;
                margin-top: 2px;
                cursor: pointer;
            }
            .checkbox-row input[type="checkbox"] {
                width: auto;
                margin: 0;
                padding: 0;
                cursor: pointer;
            }
            .muted {
                color: var(--muted);
            }

            @media (max-width: 760px) {
                form.grid {
                    grid-template-columns: repeat(2, 1fr);
                }
                table {
                    font-size: 11.5px;
                }
                th,
                td {
                    padding: 6px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Zone Trader</h1>

            <div class="card">
                <form id="trade-form" class="grid" autocomplete="off">
                    <div class="field">
                        <label for="symbol">Symbol *</label>
                        <select id="symbol" name="symbol" required>
                            <option value="EURUSD">EURUSD</option>
                            <option value="GBPUSD">GBPUSD</option>
                            <option value="USDJPY">USDJPY</option>
                            <option value="EURGBP">EURGBP</option>
                            <option value="AUDUSD">AUDUSD</option>
                            <option value="AUDNZD">AUDNZD</option>
                            <option value="EURJPY">EURJPY</option>
                            <option value="USDCAD">USDCAD</option>
                            <option value="XAUUSD">XAUUSD</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="direction">Direction *</label>
                        <select id="direction" name="direction" required>
                            <option value="long">long</option>
                            <option value="short">short</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="level_type">Level type *</label>
                        <select id="level_type" name="level_type" required>
                            <option value="watch">watch</option>
                            <option value="order" selected>order</option>
                            <option value="option">option</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="level_size">Level size</label>
                        <select id="level_size" name="level_size">
                            <option value="">none</option>
                            <option value="watched">watched</option>
                            <option value="medium">medium</option>
                            <option value="large">large</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="limit_price">Limit price *</label>
                        <input id="limit_price" name="limit_price" type="number" step="any" required />
                        <label class="checkbox-row">
                            <input type="checkbox" id="market_order" name="market_order" />
                            <span>market order (no limit price)</span>
                        </label>
                    </div>

                    <div class="field">
                        <label for="stop_loss">Stop loss *</label>
                        <input id="stop_loss" name="stop_loss" type="number" step="any" required />
                    </div>

                    <div class="field">
                        <label for="take_profit">Take profit</label>
                        <input id="take_profit" name="take_profit" type="number" step="any" />
                    </div>

                    <div class="field">
                        <label for="partial_take_profit">Partial TP</label>
                        <input id="partial_take_profit" name="partial_take_profit" type="number" step="any" />
                    </div>

                    <div class="field">
                        <label for="valid_until">Valid until *</label>
                        <input
                            id="valid_until"
                            name="valid_until"
                            class="time-input"
                            type="text"
                            inputmode="numeric"
                            pattern="([01]\d|2[0-3]):[0-5]\d"
                            placeholder="HH:MM"
                            value="15:59"
                            maxlength="5"
                            required
                        />
                        <label class="checkbox-row">
                            <input type="checkbox" id="valid_until_next_day" name="valid_until_next_day" />
                            <span>next day</span>
                        </label>
                    </div>

                    <div class="field">
                        <label for="close_time">Close time</label>
                        <input
                            id="close_time"
                            name="close_time"
                            class="time-input"
                            type="text"
                            inputmode="numeric"
                            pattern="([01]\d|2[0-3]):[0-5]\d"
                            placeholder="HH:MM"
                            maxlength="5"
                        />
                        <label class="checkbox-row">
                            <input type="checkbox" id="close_time_next_day" name="close_time_next_day" />
                            <span>next day</span>
                        </label>
                    </div>

                    <div class="field">
                        <label for="close_after_minutes">Close after (min)</label>
                        <input id="close_after_minutes" name="close_after_minutes" type="number" min="1" step="1" placeholder="e.g. 150" />
                        <span class="checkbox-row"><span>minutes after fill (alt. to Close time)</span></span>
                    </div>

                    <div class="row-actions">
                        <button type="reset" class="ghost">Reset</button>
                        <button type="submit" class="primary">Submit Trade</button>
                    </div>

                    <div id="message" class="full"></div>
                </form>
            </div>

            <h2>History</h2>
            <div style="overflow-x: auto">
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Symbol</th>
                            <th>Dir</th>
                            <th>Limit</th>
                            <th>SL</th>
                            <th>TP</th>
                            <th>Partial</th>
                            <th>Type</th>
                            <th>Size</th>
                            <th>Valid until</th>
                            <th>Close time</th>
                            <th>Exit</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr>
                            <td colspan="13" class="muted">Loading…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <script>
            const form = document.getElementById("trade-form");
            const messageEl = document.getElementById("message");

            function setMessage(text, kind) {
                messageEl.textContent = text;
                messageEl.className = kind || "";
            }

            function numberOrNull(v) {
                if (v === "" || v === null || v === undefined) return null;
                const n = Number(v);
                return isFinite(n) ? n : null;
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                setMessage("", "");
                const fd = new FormData(form);
                const symbol = fd.get("symbol");

                const isMarket = fd.get("market_order") === "on";
                const closeAfterRaw = fd.get("close_after_minutes");
                const closeAfterMinutes = closeAfterRaw === "" || closeAfterRaw === null ? null : Number(closeAfterRaw);
                const body = {
                    direction: fd.get("direction"),
                    order_kind: isMarket ? "market" : "limit",
                    limit_price: isMarket ? null : numberOrNull(fd.get("limit_price")),
                    stop_loss: numberOrNull(fd.get("stop_loss")),
                    take_profit: numberOrNull(fd.get("take_profit")),
                    partial_take_profit: numberOrNull(fd.get("partial_take_profit")),
                    level_type: fd.get("level_type"),
                    level_size: fd.get("level_size") || null,
                    valid_until: fd.get("valid_until"),
                    valid_until_next_day: fd.get("valid_until_next_day") === "on",
                    close_time: fd.get("close_time") || null,
                    close_time_next_day: fd.get("close_time_next_day") === "on",
                    close_after_minutes: closeAfterMinutes,
                };

                if (body.close_time && body.close_after_minutes) {
                    setMessage("Use either Close time or Close after — not both.", "err");
                    return;
                }
                if (body.close_after_minutes != null && (!Number.isInteger(body.close_after_minutes) || body.close_after_minutes <= 0)) {
                    setMessage("Close after must be a positive whole number of minutes.", "err");
                    return;
                }

                // Client-side guard: close_time must be strictly after valid_until.
                if (body.close_time) {
                    const toMin = (t, nextDay) => {
                        const [h, m] = t.split(":").map(Number);
                        return h * 60 + m + (nextDay ? 24 * 60 : 0);
                    };
                    const vuMin = toMin(body.valid_until, body.valid_until_next_day);
                    const ctMin = toMin(body.close_time, body.close_time_next_day);
                    if (ctMin <= vuMin) {
                        setMessage("Close time must be after Valid until (toggle 'next day' on Close time if it should fire after midnight).", "err");
                        return;
                    }
                }

                try {
                    const res = await fetch("/" + symbol, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body),
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.details ? err.details.join(", ") : err.error || "HTTP " + res.status);
                    }
                    setMessage("Trade submitted.", "ok");
                    form.reset();
                    document.getElementById("valid_until").value = "15:59";
                    loadHistory();
                } catch (err) {
                    setMessage("Failed: " + err.message, "err");
                }
            });

            // Market order toggle: disable & clear limit price when checked.
            const marketOrderEl = document.getElementById("market_order");
            const limitPriceEl = document.getElementById("limit_price");
            function applyMarketOrderState() {
                if (marketOrderEl.checked) {
                    limitPriceEl.value = "";
                    limitPriceEl.required = false;
                    limitPriceEl.disabled = true;
                } else {
                    limitPriceEl.required = true;
                    limitPriceEl.disabled = false;
                }
            }
            marketOrderEl.addEventListener("change", applyMarketOrderState);
            form.addEventListener("reset", () => setTimeout(applyMarketOrderState, 0));
            applyMarketOrderState();

            // Auto-format time inputs: typing digits inserts ":" automatically.
            function formatTimeDigits(digits) {
                digits = digits.replace(/\D/g, "").slice(0, 4);
                if (digits.length <= 2) return digits;
                return digits.slice(0, 2) + ":" + digits.slice(2);
            }
            document.querySelectorAll(".time-input").forEach((el) => {
                el.addEventListener("input", (e) => {
                    const raw = e.target.value;
                    const formatted = formatTimeDigits(raw);
                    if (formatted !== raw) {
                        e.target.value = formatted;
                    }
                });
                el.addEventListener("blur", (e) => {
                    let digits = e.target.value.replace(/\D/g, "");
                    if (digits.length === 3) digits = "0" + digits;
                    if (digits.length === 1 || digits.length === 2) digits = digits.padStart(2, "0") + "00";
                    if (digits.length === 4) e.target.value = digits.slice(0, 2) + ":" + digits.slice(2);
                });
            });

            function fmtPrice(v) {
                if (v === null || v === undefined) return "—";
                return Number(v).toString();
            }

            function isProfitable(trade, exitPrice) {
                if (trade.direction === "long") return exitPrice > trade.limit_price;
                if (trade.direction === "short") return exitPrice < trade.limit_price;
                return false;
            }

            async function loadHistory() {
                const body = document.getElementById("history-body");
                try {
                    const [tradesRes, reportsRes] = await Promise.all([fetch("/trades"), fetch("/reports")]);
                    const trades = await tradesRes.json();
                    const reports = await reportsRes.json();
                    const reportById = new Map(reports.map((r) => [r.id, r]));

                    const sorted = trades.slice().sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));

                    if (!sorted.length) {
                        body.innerHTML = '<tr><td colspan="13" class="muted">No trades yet.</td></tr>';
                        return;
                    }

                    const now = Date.now();
                    body.innerHTML = sorted
                        .map((t) => {
                            const report = reportById.get(t.id);
                            let status, exitCell;
                            if (report) {
                                const win = isProfitable(t, report.exit_price);
                                status = '<span class="tag ' + (win ? "win" : "loss") + '">' + (win ? "Profit" : "Loss") + "</span>";
                                exitCell = fmtPrice(report.exit_price);
                            } else {
                                const expired = t.valid_until_utc && new Date(t.valid_until_utc).getTime() <= now;
                                status = expired ? '<span class="tag expired">Expired</span>' : '<span class="tag waiting">Waiting</span>';
                                exitCell = "—";
                            }
                            const dirCls = t.direction === "long" ? "dir-long" : "dir-short";
                            const rowCls = t.direction === "long" ? "row-long" : "row-short";
                            const limitCell = t.order_kind === "market" ? "MKT" : fmtPrice(t.limit_price);
                            return (
                                '<tr class="' +
                                rowCls +
                                '">' +
                                "<td>" +
                                (t.local_date || "") +
                                "</td>" +
                                "<td>" +
                                t.symbol +
                                "</td>" +
                                '<td class="' +
                                dirCls +
                                '">' +
                                t.direction +
                                "</td>" +
                                "<td>" +
                                limitCell +
                                "</td>" +
                                "<td>" +
                                fmtPrice(t.stop_loss) +
                                "</td>" +
                                "<td>" +
                                fmtPrice(t.take_profit) +
                                "</td>" +
                                "<td>" +
                                fmtPrice(t.partial_take_profit) +
                                "</td>" +
                                "<td>" +
                                (t.level_type || "") +
                                "</td>" +
                                "<td>" +
                                (t.level_size || "—") +
                                "</td>" +
                                "<td>" +
                                ((t.valid_until || "") + (t.valid_until_next_day ? " (+1d)" : "")) +
                                "</td>" +
                                "<td>" +
                                (t.close_time
                                    ? t.close_time + (t.close_time_next_day ? " (+1d)" : "")
                                    : t.close_after_minutes
                                      ? "+" + t.close_after_minutes + "m"
                                      : "—") +
                                "</td>" +
                                "<td>" +
                                exitCell +
                                "</td>" +
                                "<td>" +
                                status +
                                "</td>" +
                                "</tr>"
                            );
                        })
                        .join("");
                } catch (e) {
                    body.innerHTML = '<tr><td colspan="13" class="err">Failed to load history: ' + e.message + "</td></tr>";
                }
            }

            loadHistory();
            setInterval(loadHistory, 30000);
        </script>
    </body>
</html>
